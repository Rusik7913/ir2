name: Build ESP8266 IR firmware

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@v2
      - name: Configure Arduino CLI
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://arduino.esp8266.com/stable/package_esp8266com_index.json
          arduino-cli core update-index
          arduino-cli core install esp8266:esp8266
          arduino-cli lib install IRremoteESP8266
      - name: Compile for NodeMCU ESP8266
        run: |
          mkdir -p build
          arduino-cli compile --fqbn esp8266:esp8266:nodemcuv2 --output-dir build IR_Web_ESP8266_All_Protocols
      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: ESP8266-IR-firmware
          path: build/*.bin
          if-no-files-found: error
