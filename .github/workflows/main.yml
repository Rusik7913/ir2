name: Build ESP8266 IR firmware

on:
workflow_dispatch:
push:
branches: [main]

jobs:
build:
runs-on: ubuntu-latest
steps:
- name: Checkout
uses: actions/checkout@v4

  - name: Setup Arduino CLI
    uses: arduino/setup-arduino-cli@v2

  - name: Install ESP8266 core
    run: |
      arduino-cli config init
      arduino-cli config add board_manager.additional_urls https://arduino.esp8266.com/stable/package_esp8266com_index.json
      arduino-cli core update-index
      arduino-cli core install esp8266:esp8266

  - name: Install IR library
    run: arduino-cli lib install IRremoteESP8266

  - name: Compile firmware
    run: |
      mkdir -p IR_Web_ESP8266_All_Protocols
      cp IR_Web_ESP8266_All_Protocols.ino IR_Web_ESP8266_All_Protocols/
      arduino-cli compile --fqbn esp8266:esp8266:nodemcuv2 IR_Web_ESP8266_All_Protocols

  - name: Upload firmware
    uses: actions/upload-artifact@v4
    with:
      name: ESP8266-IR-firmware
      path: IR_Web_ESP8266_All_Protocols/*.bin
